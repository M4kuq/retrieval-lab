schema_version: 1

experiment:
  name: japanese-offline-tutorial
  seed: 42

corpus:
  path: corpus
  include: ["*.md"]
  chunker:
    type: recursive_characters
    size: 256
    overlap: 32

dataset:
  path: qrels.jsonl
  format: native_jsonl
  relevance_level: document

retrievers:
  - name: keyword
    type: keyword
  - name: bm25
    type: bm25
    tokenizer: default
    k1: 1.5
    b: 0.75

evaluation:
  top_k: [1, 3]
  metrics: [hit_rate, recall, precision, mrr, ndcg, ap]
  repetitions: 1
  concurrency: 1

quality_gates: []

report:
  output_dir: reports
  formats: [json, csv, html]
