name: Retrieval quality gate example

on:
  workflow_dispatch:

permissions:
  contents: read

# The checked-in baseline and improved candidate are complete schema_version: 1
# fixtures, so the gate command is runnable as written after this template is
# copied into .github/workflows. It does not depend on a missing candidate file.
jobs:
  retrieval-quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: uv sync --extra dev
      - name: Evaluate the saved baseline and candidate
        run: |
          uv run retrieval-lab gate \
            --config examples/ci/retrieval-lab.yaml \
            --baseline examples/ci/baseline.json \
            examples/ci/candidate-improved.json \
            --json
