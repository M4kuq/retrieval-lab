schema_version: 1
corpus:
  path: ./corpus
dataset:
  path: ./dataset.jsonl
  format: native_jsonl
  relevance_level: document
retrievers:
  - name: bm25
    type: bm25
evaluation:
  top_k: [1]
  metrics: [hit_rate, recall, precision, mrr, ndcg, ap]
quality_gates:
  - retriever: bm25
    metric: recall@1
    max_absolute_drop: 0.1
    max_relative_drop: 0.2
