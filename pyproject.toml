[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "retrieval-lab-sdk"
version = "0.1.0rc1"
description = "Local-first evaluation SDK for RAG retrieval strategies"
readme = "docs/index.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Retrieval Lab contributors" }]
keywords = ["rag", "retrieval", "evaluation", "information-retrieval"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = ["pyyaml>=6,<7"]

[project.urls]
Homepage = "https://github.com/M4kuq/retrieval-lab"
Documentation = "https://m4kuq.github.io/retrieval-lab/"
Repository = "https://github.com/M4kuq/retrieval-lab"
Issues = "https://github.com/M4kuq/retrieval-lab/issues"
Changelog = "https://github.com/M4kuq/retrieval-lab/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dense = ["sentence-transformers>=5,<6"]
docs = ["mkdocs>=1.6,<2"]
dev = [
  "build>=1.3,<2",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
  "setuptools>=77",
  "types-PyYAML>=6,<7",
]

[project.scripts]
retrieval-lab = "retrieval_lab.cli.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
retrieval_lab = ["py.typed"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=retrieval_lab --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["retrieval_lab"]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]

[tool.ruff]
extend-exclude = ["docs/**"]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["retrieval_lab"]
mypy_path = "src"
